[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "zig-PY"
version = "0.0.0"
description = "Small Python-to-Zig shared-library bridge foundation."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "zig-PY contributors" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zig-py-doctor = "zig_py.doctor:main"
zig-py-build-example = "zig_py.build:main"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
